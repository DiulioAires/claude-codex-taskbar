name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "claude-codex-taskbar-${{ github.ref_name }}-x64"
          New-Item -ItemType Directory -Force dist, $name | Out-Null
          Copy-Item target/release/claude-codex-taskbar.exe dist/claude-codex-taskbar.exe
          Copy-Item target/release/claude-codex-taskbar.exe, README.md, LICENSE, CHANGELOG.md $name
          Compress-Archive -Path "$name/*" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            # LF line endings so `sha256sum -c SHA256SUMS.txt` works everywhere.
            [IO.File]::AppendAllText("$PWD/dist/SHA256SUMS.txt", "$hash  $($_.Name)`n")
          }
          Get-Content dist/SHA256SUMS.txt
      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/claude-codex-taskbar.exe
            dist/SHA256SUMS.txt
