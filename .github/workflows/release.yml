name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "claude-codex-taskbar-${{ github.ref_name }}-x64"
          New-Item -ItemType Directory -Force dist, $name | Out-Null
          Copy-Item target/release/claude-codex-taskbar.exe dist/claude-codex-taskbar.exe
          Copy-Item target/release/claude-codex-taskbar.exe, README.md, LICENSE, CHANGELOG.md $name
          Compress-Archive -Path "$name/*" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            # LF line endings so `sha256sum -c SHA256SUMS.txt` works everywhere.
            [IO.File]::AppendAllText("$PWD/dist/SHA256SUMS.txt", "$hash  $($_.Name)`n")
          }
          Get-Content dist/SHA256SUMS.txt
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/claude-codex-taskbar.exe
            dist/SHA256SUMS.txt
